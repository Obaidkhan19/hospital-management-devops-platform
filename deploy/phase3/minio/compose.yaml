# compose.yaml - S3 storage (MinIO) on your laptop, OUTSIDE the cluster. Velero sends backups here,
# so they survive when you destroy the VMs. Start: docker compose up -d. The init container creates the bucket "velero".
# MinIO no longer publishes community images, so the server comes from Chainguard and the bucket is made with the AWS CLI.
services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    env_file: .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: amazon/aws-cli
    depends_on:
      - minio
    env_file: .env
    environment:
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "export AWS_ACCESS_KEY_ID=$$MINIO_ROOT_USER AWS_SECRET_ACCESS_KEY=$$MINIO_ROOT_PASSWORD;
      until aws --endpoint-url http://minio:9000 s3api head-bucket --bucket velero || aws --endpoint-url http://minio:9000 s3 mb s3://velero; do sleep 2; done"

volumes:
  minio-data: