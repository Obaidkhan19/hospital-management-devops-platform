# monitoring.yaml - Phase 3 additions on top of your Phase 2 deploy/monitoring/values-monitoring.yaml
# (later file wins). What changes:
#   1 scrape the RKE2 control plane (etcd, scheduler, controller-manager, kube-proxy) - ports set in the Ansible config
#   2 Grafana login comes from Vault (secret grafana-admin), not from a command line flag
#   3 Loki as a second Grafana data source, so logs sit next to metrics
#   4 *.test host names and UIs for Prometheus and Alertmanager
#   5 pick up the hospital alert rules
kubeEtcd:
  enabled: true
  service: {enabled: true, port: 2381, targetPort: 2381}
kubeControllerManager:
  enabled: true
  service: {enabled: true, port: 10257, targetPort: 10257}
  serviceMonitor: {https: true, insecureSkipVerify: true}
kubeScheduler:
  enabled: true
  service: {enabled: true, port: 10259, targetPort: 10259}
  serviceMonitor: {https: true, insecureSkipVerify: true}
kubeProxy:
  enabled: true
  service: {enabled: true, port: 10249, targetPort: 10249}
defaultRules:
  rules:
    etcd: true
    kubeScheduler: true
    kubeControllerManager: true
    kubeProxy: true

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    hosts:
      - grafana.test
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.loki.svc.cluster.local:3100

prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.test
  prometheusSpec:
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - alertmanager.test
