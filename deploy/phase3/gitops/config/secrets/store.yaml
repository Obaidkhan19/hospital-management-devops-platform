# store.yaml - tells External Secrets how to reach Vault: Kubernetes login (no token stored anywhere),
# role "external-secrets", secrets engine "secret" (KV v2). The Vault side is created by scripts/vault-init.sh.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          
