# external-secrets.yaml - four recipes "read this path in Vault, create that Kubernetes Secret".
#   hospital-a, hospital-b : hospital-secret (MSSQL_SA_PASSWORD, Seed__AdminPassword), same name the Phase 2 chart expects
#   monitoring             : grafana-admin (Grafana login)
#   velero                 : cloud-credentials (MinIO login for backups)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hospital-secret
  namespace: hospital-a
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault, kind: ClusterSecretStore}
  target: {name: hospital-secret}
  dataFrom:
    - extract: {key: hospital-a}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hospital-secret
  namespace: hospital-b
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault, kind: ClusterSecretStore}
  target: {name: hospital-secret}
  dataFrom:
    - extract: {key: hospital-b}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault, kind: ClusterSecretStore}
  target: {name: grafana-admin}
  dataFrom:
    - extract: {key: grafana}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloud-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault, kind: ClusterSecretStore}
  target: {name: cloud-credentials}
  dataFrom:
    - extract: {key: velero}
