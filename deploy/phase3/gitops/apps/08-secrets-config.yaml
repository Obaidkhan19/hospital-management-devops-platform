# Wires ESO to Vault (config/secrets): one ClusterSecretStore plus the ExternalSecrets for
# hospital-a, hospital-b, Grafana admin and the Velero MinIO login. No secret values are in Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-config
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  project: default
  source:
    repoURL: https://github.com/Obaidkhan19/hospital-management-devops-platform
    targetRevision: main
    path: deploy/phase3/gitops/config/secrets
  destination: {server: https://kubernetes.default.svc, namespace: external-secrets}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [SkipDryRunOnMissingResource=true, CreateNamespace=true]
    retry: {limit: 20, backoff: {duration: 20s, factor: 2, maxDuration: 5m}}
