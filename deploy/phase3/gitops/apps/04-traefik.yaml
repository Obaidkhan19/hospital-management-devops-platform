
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: "*"
    helm:
      valuesObject:
        deployment:
          replicas: 1
        service:
          annotations:
            metallb.io/loadBalancerIPs: "10.10.10.200"
          spec:
            type: LoadBalancer
        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
        ingressClass:
          enabled: true
          isDefaultClass: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m