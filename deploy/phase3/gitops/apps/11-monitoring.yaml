# Prometheus + Grafana + Alertmanager (kube-prometheus-stack), release name "monitoring" as in Phase 2.
# Two values files are layered: your Phase 2 deploy/monitoring/values-monitoring.yaml first,
# then values/monitoring.yaml (RKE2 metrics, Loki datasource, Grafana login from Vault, *.test hosts).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "*"
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/deploy/monitoring/values-monitoring.yaml
          - $values/deploy/phase3/gitops/values/monitoring.yaml
    - repoURL: https://github.com/Obaidkhan19/hospital-management-devops-platform
      targetRevision: main
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: monitoring}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    managedNamespaceMetadata: {labels: {pod-security.kubernetes.io/enforce: privileged}}
    retry: {limit: 20, backoff: {duration: 20s, factor: 2, maxDuration: 5m}}
