# Kyverno policy: every container in the hospital namespaces must set CPU/memory requests and a memory limit.
# (The Phase 2 chart already does, this keeps it that way.) Audit mode.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resources
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: requests-and-limits
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [hospital-a, hospital-b]
      validate:
        message: "Set resources.requests (cpu, memory) and resources.limits.memory."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
