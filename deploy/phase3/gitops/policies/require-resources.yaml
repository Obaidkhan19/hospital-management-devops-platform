
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resources
spec:
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: hospital-namespaces-only
      expression: >-
        object.metadata.namespace in ['hospital-a', 'hospital-b']
  validations:
    - message: "Set resources.requests (cpu, memory) and resources.limits.memory."
      expression: >-
        object.spec.containers.all(
          container,
          has(container.resources) &&
          has(container.resources.requests) &&
          has(container.resources.requests.cpu) &&
          has(container.resources.requests.memory) &&
          has(container.resources.limits) &&
          has(container.resources.limits.memory)
        )
