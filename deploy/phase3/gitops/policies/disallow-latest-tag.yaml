# Kyverno policy: no image may use the tag ":latest" (it changes silently). Audit mode, system namespaces skipped.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: no-latest
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kube-public, kube-node-lease]
      validate:
        message: "Use a fixed image tag, not :latest."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
