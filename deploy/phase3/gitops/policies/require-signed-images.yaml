
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-signed-images
spec:
  validationActions:
    - Audit
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: hospital-namespaces-only
      expression: >-
        object.metadata.namespace in ['hospital-a', 'hospital-b']
  matchImageReferences:
    - glob: "ghcr.io/obaidkhan19/hospital-web*"
  attestors:
    - name: cosign
      cosign:
        keyless:
          identities:
            - subject: "https://github.com/Obaidkhan19/hospital-management-devops-platform/.github/workflows/phase3_release.yml@refs/heads/main"
              issuer: "https://token.actions.githubusercontent.com"
        ctlog:
          url: "https://rekor.sigstore.dev"
  validations:
    - message: "Hospital web images must have a valid GitHub Actions Cosign signature."
      expression: >-
        images.containers.map(
          image,
          verifyImageSignatures(image, [attestors.cosign])
        ).all(result, result > 0)
