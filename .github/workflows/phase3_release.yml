# from a code change to an image Argo CD deploys.

name: phase3_release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - ".github/workflows/phase3_release.yml"
  workflow_dispatch:

permissions:
  contents: write     # commit the new image tag
  packages: write     # push to ghcr.io
  id-token: write     # keyless cosign signing

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Image name and tag
        id: meta
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/hospital-web" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (local only, for the scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Push to ghcr.io
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha

      - name: SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image and attach the SBOM (keyless)
        run: |
          IMG="${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
          cosign sign --yes "$IMG"
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMG"

      - name: Commit the new tag (Argo CD deploys it)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git pull --rebase origin main
          F=deploy/phase3/gitops/values/image.yaml
          sed -i "s|^\( *\)repository:.*|\1repository: ${{ steps.meta.outputs.image }}|; s|^\( *\)tag:.*|\1tag: ${{ steps.meta.outputs.tag }}|" "$F"
          git add "$F"
          git commit -m "release: web image ${{ steps.meta.outputs.tag }} [skip ci]" || exit 0
          git push origin HEAD:main
